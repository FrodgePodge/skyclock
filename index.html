<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Clock</title>
<style>
  :root {
    --bg: #0f1211;
    --text: #b4b0a8; --text-night: #9c998f; --ring: #232824;
    --muted: #6c6e68;
    --faint: #2c312d;
    --orange: #b8693a;
    /* sky colours, set from the sun's height over your location */
    --sky-top: #0b0e0d; --sky-bot: #0f1312; --glow: #191e1b; --hor: #000; --soil: #131614;
    --soil-far: #121513; --soil-mid: #131614; --water: #0d1110;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky-top); }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--text); }

  svg.view { position: fixed; top: 0; height: 100%; }
  svg.view .sway { transform-box: view-box; animation: sway 16s ease-in-out infinite alternate; }
  svg.view .sway.slow { animation-duration: 23s; }
  @keyframes sway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.3deg); } }

  /* the frog and the crab, in the open corner of the garden (each can be switched off in config.js) */
  body.no-frog .frog, body.no-crab .crab { display: none; }
  .frog .body { animation: bob 4.6s steps(1) infinite; }
  .crab .body { animation: scuttle 11s steps(1) infinite; }
  .frog .eyes { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.15); } }
  @keyframes scuttle { 0%, 38% { transform: translateX(0); } 40% { transform: translateX(-9px); } 44% { transform: translateX(-18px); } 46%, 78% { transform: translateX(-18px); } 80% { transform: translateX(-9px); } 82%, 100% { transform: translateX(0); } }

  /* clocks */
  #clocks {
    position: fixed; top: 46%; transform: translate(-50%, -50%);
    display: flex; align-items: stretch;
    text-shadow: 0 0 22px rgba(0, 0, 0, .35);
  }
  .city { text-align: center; padding: 0 clamp(18px, 3vw, 64px); }
  .city + .city { border-left: 1px solid var(--faint); }
  .name { font-size: clamp(10px, 1.5vh, 15px); letter-spacing: .34em; text-transform: uppercase; color: var(--muted); padding-left: .34em; }
  .time { font-size: clamp(36px, 8vh, 88px); font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1.15; margin: .12em 0 .1em; }
  .meta { font-size: clamp(10px, 1.35vh, 14px); color: var(--muted); display: flex; gap: .7em; justify-content: center; align-items: center; letter-spacing: .08em; }
  .dot { width: .6em; height: .6em; border-radius: 50%; }
  .day .dot { background: var(--orange); opacity: .7; }
  .night .dot { box-shadow: inset .2em -.13em 0 0 var(--muted); transform: rotate(-20deg); }
  .night .time { color: var(--text-night); }

  /* drifting petals */
  .petal {
    position: fixed; top: -4vh; width: 10px; height: 6px; border-radius: 70% 0 70% 0;
    background: #8a5662; opacity: .3; animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(-6vh, 55vh) rotate(200deg); }
    100% { transform: translate(4vh, 110vh) rotate(420deg); }
  }

  /* gentle extra dimming in the evening */
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity 60s linear; pointer-events: none; }

  /* a few stars twinkle */
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle { from { transform: scale(.55); } to { transform: scale(1.2); } }

  @media (prefers-reduced-motion: reduce) {
    svg.view .sway, .frog .body, .crab .body, .frog .eyes, .petal, .twinkle { animation: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1080">
      <stop offset="0" style="stop-color: var(--sky-top)"/>
      <stop offset="1" style="stop-color: var(--sky-bot)"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" style="stop-color: var(--glow)"/>
      <stop offset="1" style="stop-color: var(--glow); stop-opacity: 0"/>
    </radialGradient>
    <radialGradient id="corona">
      <stop offset=".3" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff7d6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="umbraGrad">
      <stop offset="0" stop-color="#8a2f14" stop-opacity=".7"/>
      <stop offset=".8" stop-color="#8a2f14" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8a2f14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="penumbraGrad">
      <stop offset="0" stop-color="#000" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#000" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGrad">
      <stop offset="0" style="stop-color: var(--hor)"/>
      <stop offset="1" style="stop-color: var(--hor); stop-opacity: 0"/>
    </radialGradient>
  </defs>
</svg>

<div id="clocks"></div>
<div id="dim"></div>

<script src="config.js"></script>
<script src="sky-data.js"></script>
<script>
/*
  One world, 1080 units high and one 1920-wide monitor after another (a 50-unit bezel gap between): one, two or three
  monitors. Spanned across them (Lively: Screen layout > Span), each monitor's share of the window shows its slice.
  The count comes from the window's shape unless `monitors` is set (or ?monitors=1|2|3).
  The sky is the real one over your location, seen from a window facing the way you say: the sun, the moon, about
  2,000 catalogue stars and the five naked-eye planets. Settings are in config.js (or Lively's customise panel).
  Previews: ?sun=<altitude>,<azimuth>, ?moon=<altitude>,<azimuth>, ?time=<ISO time>, ?pick=<constellation id or planet>,
  and ?lat=, ?lon=, ?dir= (a compass point or degrees) to try other places and windows.
*/

/* ---------- settings ---------- */
const DEFAULTS = {
  latitude: 51.5, longitude: -0.1, window: 'NE', monitors: 'auto', bezel: 50, home: 'local', order: 'listed', frog: true, crab: true, livelyPanel: true,
  cities: [{ name: 'London', timezone: 'Europe/London' }, { name: 'New York', timezone: 'America/New_York' }, { name: 'Tokyo', timezone: 'Asia/Tokyo' }]
};
const MAX_CITIES = 5;
const cfg = Object.assign({}, DEFAULTS, window.SKYCLOCK_CONFIG);
{
  const q = new URLSearchParams(location.search);
  if (q.get('lat')) cfg.latitude = +q.get('lat');
  if (q.get('lon')) cfg.longitude = +q.get('lon');
  if (q.get('dir')) cfg.window = q.get('dir');
  if (q.get('monitors')) cfg.monitors = q.get('monitors');
  if (q.get('bezel')) cfg.bezel = +q.get('bezel');
}
const COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
// a compass point ("NE", "ssw") or a bearing in degrees clockwise from north (45, "112.5")
function parseDirection(v) {
  const s = String(v).trim().toUpperCase().replace(/\s+/g, '');
  if (/^-?\d+(\.\d+)?$/.test(s)) return ((+s % 360) + 360) % 360;
  const i = COMPASS.indexOf(s);
  if (i < 0) console.warn(`Sky Clock: "${v}" isn't a compass point (N, NNE, NE, ENE, E ...) or a bearing; using north`);
  return Math.max(0, i) * 22.5;
}
// "Name=Zone, Name=Zone=nudge" (the Lively text box) to the list config.js uses
function parseCities(s) {
  return String(s).split(/[,;\n]/).map(p => p.split('=')).filter(p => p[0].trim() && p[1] && p[1].trim())
    .map(p => ({ name: p[0].trim(), timezone: p[1].trim(), nudge: +p[2] || 0 }));
}
// where the sun and moon's panorama is cut. Neither can be above the horizon in the direction of the nearer pole, so
// that's where the seam goes, nudged up to 30 degrees anticlockwise (while the quiet band is wide enough) so the noon
// sun lands on the right-hand screen instead of the gap between the two. Between about 29 degrees north and south
// they can cross the seam, and just slide off one edge and back on at the other
function seamFor(lat) {
  const ratio = Math.sin(28.6 * Math.PI / 180) / Math.cos(lat * Math.PI / 180);
  const band = Math.abs(lat) > 28.6 && ratio < 1 ? Math.acos(ratio) * 180 / Math.PI : 0;
  return ((lat >= 0 ? 0 : 180) - Math.min(30, Math.max(0, band - 8)) + 360) % 360;
}
let SITE = { lat: 0, lon: 0 }, WINDOW_AZ = 0, SEAM_AZ = 0, HOME_TZ = 'UTC';

// The world is one 1080-high strip, one 1920-wide monitor after another with a 50-unit bezel gap between (so one, two or
// three monitors are 1920, 3890 or 5860 units wide). setWorld() sets how many; each monitor gets its own SVG slice of it
const MON = 1920, H = 1080;
let GAP = 50;                                                  // the bezel gap, from the `bezel` setting
const monitorX = i => i * (MON + GAP);
let N_MON = 0, WORLD_W = 0, WORLD_CX = 0, SKY_HSCALE = 13;
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- the real sky: stars and planets ---------- */
const RAD = Math.PI / 180;
const SKY_OBJS = [];
for (let i = 0; i < STAR_CAT.length; i += 3)
  SKY_OBJS.push({ ra: STAR_CAT[i] / 100 * RAD, dec: STAR_CAT[i + 1] / 100 * RAD, mag: STAR_CAT[i + 2] / 10, color: '#fff' });
const CONSTELLATIONS = CONST_RAW.map(([id, name, ...lines]) => ({
  id, name, lines: lines.map(l => { const pts = []; for (let i = 0; i < l.length; i += 2) pts.push({ ra: l[i] / 100 * RAD, dec: l[i + 1] / 100 * RAD }); return pts; })
}));
SKY_OBJS.forEach(o => { o.r = Math.min(3.2, Math.max(.5, .55 + (4.2 - o.mag) * .42)); o.op = Math.min(1, Math.max(.16, .32 + (4.8 - o.mag) * .15)); });

// planets: JPL approximate Keplerian elements (1800-2050) -- a, e, I, L, long. perihelion, long. node, each with its rate per century
const EARTH = [1.00000261, 0.00000562, 0.01671123, -0.00004392, -0.00001531, -0.01294668, 100.46457166, 35999.37244981, 102.93768193, 0.32327364, 0, 0];
const PLANETS = [
  { name: 'Mercury', color: '#c9b8aa', m0: -0.42, mi: [0.0380, -0.000273, 2e-6], el: [0.38709927, 0.00000037, 0.20563593, 0.00001906, 7.00497902, -0.00594749, 252.25032350, 149472.67411175, 77.45779628, 0.16047689, 48.33076593, -0.12534081] },
  { name: 'Venus', color: '#f6edc2', m0: -4.40, mi: [0.0009, 0.000239, -6.5e-7], el: [0.72333566, 0.00000390, 0.00677672, -0.00004107, 3.39467605, -0.00078890, 181.97909950, 58517.81538729, 131.60246718, 0.00268329, 76.67984255, -0.27769418] },
  { name: 'Mars', color: '#e58a6c', m0: -1.52, mi: [0.016, 0, 0], el: [1.52371034, 0.00001847, 0.09339410, 0.00007882, 1.84969142, -0.00813131, -4.55343205, 19140.30268499, -23.94362959, 0.44441088, 49.55953891, -0.29257343] },
  { name: 'Jupiter', color: '#efd6a2', m0: -9.40, mi: [0.005, 0, 0], el: [5.20288700, -0.00011607, 0.04838624, -0.00013253, 1.30439695, -0.00183714, 34.39644051, 3034.74612775, 14.72847983, 0.21252668, 100.47390909, 0.20469106] },
  { name: 'Saturn', color: '#e2cd88', m0: -8.88, mi: [0, 0, 0], el: [9.53667594, -0.00125060, 0.05386179, -0.00050991, 2.48599187, 0.00193609, 49.95424423, 1222.49362201, 92.59887831, -0.41897216, 113.66242448, -0.28867794] }
];
for (const p of PLANETS) SKY_OBJS.push(Object.assign(p, { planet: true, ra: 0, dec: 0, mag: p.m0 }));

// heliocentric ecliptic position (AU) from Keplerian elements, T in Julian centuries since J2000
function helio(e, T) {
  const [a0, a1, e0, e1, i0, i1, L0, L1, w0, w1, O0, O1] = e;
  const a = a0 + a1 * T, ecc = e0 + e1 * T, I = (i0 + i1 * T) * RAD, O = (O0 + O1 * T) * RAD;
  const wbar = w0 + w1 * T, w = wbar * RAD - O;
  const M = (((L0 + L1 * T) - wbar) % 360) * RAD;
  let E = M;
  for (let n = 0; n < 8; n++) E = M + ecc * Math.sin(E);
  const xp = a * (Math.cos(E) - ecc), yp = a * Math.sqrt(1 - ecc * ecc) * Math.sin(E);
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(O), sO = Math.sin(O), cI = Math.cos(I), sI = Math.sin(I);
  return [(cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp,
          (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp,
          (sw * sI) * xp + (cw * sI) * yp];
}
// fills in each planet's geocentric RA/Dec (J2000) and apparent magnitude; d is days since J2000
function updatePlanets(d) {
  const T = d / 36525, earth = helio(EARTH, T), R = Math.hypot(...earth);
  const ce = Math.cos(23.43928 * RAD), se = Math.sin(23.43928 * RAD);
  for (const p of PLANETS) {
    const h = helio(p.el, T), r = Math.hypot(...h);
    const g = [h[0] - earth[0], h[1] - earth[1], h[2] - earth[2]], D = Math.hypot(...g);
    p.ra = Math.atan2(g[1] * ce - g[2] * se, g[0]);
    p.dec = Math.asin((g[1] * se + g[2] * ce) / D);
    const i = Math.acos((r * r + D * D - R * R) / (2 * r * D)) / RAD;   // phase angle
    p.mag = p.m0 + 5 * Math.log10(r * D) + p.mi[0] * i + p.mi[1] * i * i + p.mi[2] * i * i * i;
  }
}
// J2000 coordinates carried forward to today (low-precision general precession)
function precess(ra, dec, yrs) {
  const m = 0.012812 * RAD, n = 0.005568 * RAD;
  return [ra + (m + n * Math.sin(ra) * Math.tan(dec)) * yrs, dec + n * Math.cos(ra) * yrs];
}

const C = {
  forest: '#24382a', ivy: '#2e4535', sage: '#4c5b48', olive: '#47472c', moss: '#3a4a2c',
  bark: '#3b2e25', walnut: '#4d3a2c', soil: '#131614',
  rose: '#7f4f5b', blush: '#94636e', mauve: '#5e3f49',
  grey: '#474a46', ash: '#5d605b',
  orange: '#b8693a', crab: '#b9674a', frog: '#5d7d44', ink: '#141716'
};

/* the whole scene is drawn into each view, with the same seed so both halves match */
function build(svg) {
  const R = rng(11);

  function leaf(g, x, y, ang, s, colour, slim) {
    const w = slim ? 13 : 28;
    const lg = el('g', { transform: `translate(${x} ${y}) rotate(${ang}) scale(${s / 100})` }, g);
    el('path', { d: `M0 0 C25 -${w} 70 -${w + 2} 100 0 C70 ${w + 2} 25 ${w} 0 0Z`, fill: colour }, lg);
    el('path', { d: 'M6 0 Q50 -3 94 0', stroke: C.ink, 'stroke-opacity': .45, 'stroke-width': 2, fill: 'none' }, lg);
  }

  function branch(g, d, o) {
    const p = el('path', { d, fill: 'none', stroke: o.stem || C.bark, 'stroke-width': o.width || 3, 'stroke-linecap': 'round' }, g);
    const L = p.getTotalLength();
    for (let i = 1; i <= o.n; i++) {
      const t = (i / (o.n + 1)) * L;
      const a = p.getPointAtLength(t), b = p.getPointAtLength(Math.min(L, t + 1));
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      const s = o.size * (1 - (o.taper ?? .45) * i / o.n);
      const colour = o.colours[i % o.colours.length];
      if (o.paired) {
        leaf(g, a.x, a.y, ang + o.spread, s, colour, o.slim);
        leaf(g, a.x, a.y, ang - o.spread, s, colour, o.slim);
      } else {
        leaf(g, a.x, a.y, ang + (i % 2 ? 1 : -1) * o.spread, s, colour, o.slim);
      }
      if (o.flowers && i % o.flowers === 0) flower(g, a.x, a.y + 6, 13 + R() * 8, [C.rose, C.blush, C.mauve][i % 3]);
    }
    const end = p.getPointAtLength(L), pre = p.getPointAtLength(L - 1);
    leaf(g, end.x, end.y, Math.atan2(end.y - pre.y, end.x - pre.x) * 180 / Math.PI, o.size * .5, o.colours[0], o.slim);
  }

  function flower(g, x, y, r, colour, centre, petals = 5) {
    const f = el('g', { transform: `translate(${x} ${y}) rotate(${Math.round(R() * 72)})` }, g);
    for (let i = 0; i < petals; i++)
      el('ellipse', { cx: 0, cy: -r * .58, rx: r * .36, ry: r * .6, fill: colour, transform: `rotate(${i * 360 / petals})` }, f);
    el('circle', { r: r * .2, fill: centre || C.orange, opacity: .8 }, f);
  }

  function bud(g, x, y, r, colour) { el('circle', { cx: x, cy: y, r, fill: colour }, g); }

  // a single flower on a stem, with a leaf or two
  function stem(g, x, base, h, r, colour) {
    const lean = (R() - .5) * 30;
    el('path', { d: `M${x} ${base} Q${x + lean * .2} ${base - h * .5} ${x + lean} ${base - h}`, fill: 'none', stroke: C.moss, 'stroke-width': 2.2, 'stroke-linecap': 'round' }, g);
    leaf(g, x + lean * .1, base - h * .3, -90 - 40 - R() * 30, 30 + R() * 16, C.moss, true);
    if (h > 120) leaf(g, x + lean * .3, base - h * .55, -90 + 40 + R() * 30, 26 + R() * 14, C.olive, true);
    flower(g, x + lean, base - h, r, colour, R() < .3 ? C.walnut : C.orange, R() < .35 ? 6 : 5);
  }

  // foxglove-ish spike of bells
  function spike(g, x, base, h, colour) {
    el('path', { d: `M${x} ${base} Q${x + 6} ${base - h / 2} ${x} ${base - h}`, fill: 'none', stroke: C.moss, 'stroke-width': 2.5 }, g);
    leaf(g, x, base - 10, -150, 46, C.forest);
    leaf(g, x, base - 14, -30, 42, C.ivy);
    for (let i = 0; i < 10; i++) {
      const t = .38 + i * .065, r = (1 - t) * 15 + 3;
      el('ellipse', { cx: x + (i % 2 ? 5 : -5), cy: base - h * t, rx: r * .8, ry: r, fill: colour }, g);
    }
  }

  // low round shrub of leaves
  function bush(g, x, y, r, colours, blooms) {
    for (let i = 0; i < 18; i++)
      leaf(g, x + (R() - .5) * r * .7, y, -180 + R() * 180, r * (.55 + R() * .5), colours[i % colours.length]);
    for (let i = 0; i < (blooms || 0); i++)
      flower(g, x + (R() - .5) * r * 1.3, y - r * (.3 + R() * .6), 9 + R() * 6, [C.rose, C.blush][i % 2]);
  }

  function sway(origin, slow) {
    const g = el('g', { class: 'sway' + (slow ? ' slow' : '') }, svg);
    g.style.transformOrigin = `${origin[0]}px ${origin[1]}px`;
    g.style.animationDelay = `-${(R() * 20).toFixed(2)}s`;
    return g;
  }

  /* ---- background ---- */
  el('rect', { x: -200, y: -200, width: WORLD_W + 400, height: 1500, fill: 'url(#skyGrad)' }, svg);
  el('circle', { cx: monitorX(Math.min(N_MON, 2) - 1) + 960, cy: 500, r: 1000, fill: 'url(#glow)' }, svg);   // behind the clocks
  el('circle', { cx: 960, cy: 620, r: 900, fill: 'url(#glow)', opacity: .7 }, svg);
  // the real stars and planets, placed and faded by updateStars(); own seed so the garden layout doesn't shift
  const RS = rng(23);
  const stars = el('g', {}, svg);
  svg.skyEls = SKY_OBJS.map((o, i) => {
    const c = el('circle', { r: o.r || 2, fill: o.color, visibility: 'hidden' }, stars);
    if (!o.planet && o.mag < 3.3 && i % 3 === 0) { c.classList.add('twinkle'); c.style.animationDelay = `-${(RS() * 6).toFixed(2)}s`; }
    return c;
  });
  // what the cursor is over (a planet's ring and name, or a constellation's figure), drawn by renderHover()
  svg.hover = el('g', { style: 'opacity: 0; transition: opacity .35s; pointer-events: none' }, svg);
  // warm glow along the horizon at sunrise and sunset, follows the sun sideways
  const hor = el('ellipse', { cx: WORLD_CX, cy: 975, rx: 1500, ry: 520, fill: 'url(#horizonGrad)', opacity: 0 }, svg);
  // the sun (the splash of orange), moved by updateSky()
  const sun = el('g', {}, svg);
  el('circle', { r: 150, fill: 'none', style: 'stroke: var(--ring)', 'stroke-width': 1.5 }, sun);
  const corona = el('circle', { r: 160, fill: 'url(#corona)', opacity: 0 }, sun);          // only in a total eclipse
  const sunDisc = el('circle', { r: 51, fill: C.orange, opacity: .2 }, sun);
  // the moon, with its real phase, moving across the sky
  const maskId = 'moonMask-' + svg.id, clipId = 'moonClip-' + svg.id, defs = el('defs', {}, svg);
  const mask = el('mask', { id: maskId }, defs);
  el('circle', { r: 46, fill: '#fff' }, mask);
  const shadow = el('circle', { r: 48, fill: '#000' }, mask);

const clocksEl = document.getElementById('clocks');

function rebuildScene() {

function layout() {

    v.setAttribute('viewBox', `${monitorX(i)} 0 ${MON} ${H}`);

// 'auto' reads the monitor count from the window's shape (a 3840x1080 window is two 16:9 screens side by side)
function resolveMonitors() {
  const m = String(cfg.monitors).toLowerCase();

  return Math.min(3, Math.max(1, Math.round(+m)));

addEventListener('resize', () => { if (resolveMonitors() !== N_MON) applyConfig(); else layout(); });

/* ---------- sky: follows the sun over your location (SITE, set by applyConfig) ---------- */

// sun altitude and azimuth (degrees, azimuth from north), its ecliptic longitude (degrees) and distance (AU);
// low-precision formulae, good to about 0.01 degrees, which is what eclipses need
function sunPos(date, lat, lon) {
  const rad = Math.PI / 180;
  const d = date / 864e5 - 10957.5;                       // days since J2000
  const g = (357.529 + 0.98560028 * d) * rad;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g) - 0.0057) * rad;   // the last term is aberration
  const e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  return { ...horizontal(ra, dec, d, lat, lon), lon: L / rad, dist: 1.00014 - 0.01671 * Math.cos(g) - 0.00014 * Math.cos(2 * g) };
}

// right ascension and declination (radians) to altitude and azimuth (degrees, azimuth from north)
function horizontal(ra, dec, d, lat, lon) {
  const rad = Math.PI / 180;
  const gmst = 18.697374558 + 24.06570982441908 * d;
  const H = ((gmst * 15 + lon) % 360) * rad - ra;
  const phi = lat * rad;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  return { alt: alt / rad, az: (az / rad + 180 + 360) % 360 };
}

  } catch (e) {
    console.warn(`Sky Clock: "${cfg.home}" isn't a timezone name; offsets are shown from this computer's timezone`);
    homeOff = new Intl.DateTimeFormat('en-GB', { timeZoneName: 'longOffset' });
  }
  buildClocks();
  tick();
}
applyConfig();

// Lively's customise panel (LivelyProperties.json) calls this once per property at start-up and on every change.
// Switch it off with livelyPanel: false in config.js to make config.js the only source of settings.
let applyTimer;
window.livelyPropertyListener = (name, val) => {
  if (!cfg.livelyPanel) return;
  if (name === 'latitude' || name === 'longitude') cfg[name] = +val;
  else if (name === 'window') cfg.window = typeof val === 'number' ? COMPASS[val] : val;
  else if (name === 'cities') cfg.cities = parseCities(val);
  else if (name === 'home') cfg.home = String(val).trim() || 'local';
  else if (name === 'monitors') cfg.monitors = typeof val === 'number' ? ['auto', 1, 2, 3][val] : val;
  else if (name === 'bezel') cfg.bezel = +val;
  else if (name === 'order') cfg.order = typeof val === 'number' ? ['listed', 'timezone'][val] : val;
  else if (name === 'frog' || name === 'crab') cfg[name] = !!val;
  else return;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyConfig, 150);
};

// the clocks show minutes and nothing in the sky moves faster than a few units a minute, so tick once a minute, on the minute
setTimeout(() => { tick(); setInterval(tick, 60000); }, 60000 - (Date.now() % 60000));
</script>
</body>
</html>
